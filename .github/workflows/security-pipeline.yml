name: Security CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:

  tests:
    name: Application Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test


  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install Semgrep
        run: python -m pip install semgrep

      - name: Run custom Semgrep rules
        run: |
          semgrep scan \
            --config security/semgrep/semgrep.yml \
            --error \
            app/src
  
  sca:
    name: SCA - npm audit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high

  gitleaks:
    name: Secrets - Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    name: Container Scanning - Trivy
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t secure-cicd-app:${{ github.sha }} ./app

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: secure-cicd-app:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

  dast:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t secure-cicd-app:${{ github.sha }} ./app

      - name: Start application
        run: |
          docker run -d \
            --name secure-cicd-app \
            -p 3000:3000 \
            secure-cicd-app:${{ github.sha }}

      - name: Wait for application
        run: |
          for i in {1..30}; do
            if curl --fail http://127.0.0.1:3000/api/health; then
              exit 0
            fi
            sleep 2
          done
          echo "Application did not become ready"
          docker logs secure-cicd-app
          exit 1

      - name: Verify ZAP rules
        run: |
          echo "ZAP rules:"
          cat security/zap/rules.tsv

      - name: OWASP ZAP Baseline Scan
        run: |
          docker pull ghcr.io/zaproxy/zaproxy:stable

          set +e

          docker run --rm \
            --network=host \
            -v "${{ github.workspace }}:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:3000 \
            -c /zap/wrk/security/zap/zap-config.md \
            -J /zap/wrk/report_json.json \
            -w /zap/wrk/report_md.md \
            -r /zap/wrk/report_html.html

          exit_code=$?

          echo "ZAP exit code: $exit_code"

          exit $exit_code

      - name: Stop application
        if: always()
        run: docker stop secure-cicd-app || true